# Minimal Dovecot config for local testing only (no TLS, localhost only).
# Usage (as root):
#   mkdir -p /srv/dv/mail /run/dv && useradd -r -M vmail
#   echo "you@test.local:{PLAIN}secret123:$(id -u vmail):$(id -g vmail)::/srv/dv/mail/you" > /srv/dv/users
#   chown -R vmail /srv/dv/mail && dovecot -c scripts/dovecot-test.conf
base_dir = /run/dv
protocols = imap
listen = 127.0.0.1
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:~/Maildir
first_valid_uid = 1
passdb {
  driver = passwd-file
  args = scheme=PLAIN /srv/dv/users
}
userdb {
  driver = passwd-file
  args = /srv/dv/users
}
service imap-login {
  inet_listener imap {
    port = 9143
  }
  inet_listener imaps {
    port = 0
  }
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
